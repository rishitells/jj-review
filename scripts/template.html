<title>{{TITLE}}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap">

<style>
/* Fresh: white page, thin rules, no cards. A sticky contents column beside the tour; each step is a file range with
   notes beside its lines. Green marks added lines and reading progress, red removed lines. */
:root {
  --bg: #ffffff; --surface-2: #f5f7fa; --text: #171717; --text-2: #3b3b3b; --text-3: #737373;
  --line: #e8e8e8; --line-strong: #d4d4d4;
  --fx-code: #f5f7fa; --fx-bar: oklch(0.627 0.194 149.214); --fx-green: #157e3c; --fx-wash: oklch(0.5214 0.135 150.04 / 0.05);
  --fx-plum: oklch(0.55 0.14 320); --fx-link: #02aa6f; --fx-red: oklch(0.58 0.2 27);
  --add-w: oklch(0.62 0.17 150 / 0.09); --del-w: oklch(0.6 0.19 27 / 0.08); --del-text: #8a8a8a;
  --chip: rgba(175, 184, 193, 0.2);
  --float: 0 12px 32px rgba(23, 23, 23, 0.12), 0 2px 6px rgba(23, 23, 23, 0.06);
  --font-body: "Fixel", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #191b1f; --surface-2: #252c37; --text: #fcfcfd; --text-2: #ccd2db; --text-3: #8b93a1;
  --line: #2c313a; --line-strong: #3a404b;
  --fx-code: #21262e; --fx-green: oklch(0.871 0.15 154.449); --fx-plum: oklch(0.72 0.13 320); --fx-link: rgb(117, 238, 161); --fx-red: oklch(0.7 0.17 27);
  --add-w: oklch(0.75 0.15 150 / 0.1); --del-w: oklch(0.7 0.17 27 / 0.1); --del-text: #7d8592;
  --float: 0 12px 32px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
  color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #191b1f; --surface-2: #252c37; --text: #fcfcfd; --text-2: #ccd2db; --text-3: #8b93a1;
  --line: #2c313a; --line-strong: #3a404b;
  --fx-code: #21262e; --fx-green: oklch(0.871 0.15 154.449); --fx-plum: oklch(0.72 0.13 320); --fx-link: rgb(117, 238, 161); --fx-red: oklch(0.7 0.17 27);
  --add-w: oklch(0.75 0.15 150 / 0.1); --del-w: oklch(0.7 0.17 27 / 0.1); --del-text: #7d8592;
  --float: 0 12px 32px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
  color-scheme: dark; }

body { background: var(--bg); color: var(--text-2); font: 450 16px/1.75 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.page { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 56px; max-width: 1480px; margin: 0 auto;
  padding-block: 40px 96px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
a { color: var(--fx-link); text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--fx-bar); outline-offset: 2px; border-radius: 2px; }
code { font-family: var(--font-mono); font-size: 0.82em; background: var(--chip); padding: 1px 5px; border-radius: 4px; color: var(--text); }

/* Contents */
.toc { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; font-size: 14px; line-height: 1.45; }
.toc-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
.toc .eyebrow { font-size: 12px; color: var(--text-3); letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
.toc-toggle, .toc-open { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--text-3); cursor: pointer; border-radius: 6px; font: 450 12px/1 var(--font-mono); }
.toc-toggle { width: 26px; height: 26px; justify-content: center; margin-right: -6px; }
.toc-toggle:hover, .toc-open:hover { color: var(--text); background: var(--surface-2); }
.toc-toggle svg, .toc-open svg { width: 16px; height: 16px; }

/* Collapsed: the contents leave the grid, and a small button at the top left shows them floating over the page. */
/* Level with a stuck chapter heading: its 30px title line sits 12px from the top. */
.toc-open { display: none; position: fixed; z-index: 19; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  height: 30px; padding: 0 10px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.page[data-collapsed="true"] { grid-template-columns: minmax(0, 1fr); padding-left: max(96px, env(safe-area-inset-left, 0px)); }
.page[data-collapsed="true"] .toc-open { display: inline-flex; }
.page[data-collapsed="true"] .toc { position: fixed; z-index: 20; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  width: 17rem; max-height: calc(100vh - 32px); padding: 14px 16px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--float);
  opacity: 0; transform: translateX(-8px); pointer-events: none; visibility: hidden; transition: opacity 140ms, transform 140ms, visibility 0s 140ms; }
.page[data-collapsed="true"] .toc.peek { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity 140ms, transform 140ms; }
.page[data-collapsed="true"] .toc-toggle svg { transform: scaleX(-1); }
.toc ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.toc li a { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--text-2); }
.toc li a:hover { text-decoration: none; color: var(--text); }
.toc .n { font: 500 12px/1.6 var(--font-mono); color: var(--text-3); }
.toc .c { font: 450 12px/1.6 var(--font-mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
.toc li.done a .t { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.toc li.done .n { color: var(--fx-green); }
.toc li.here a { color: var(--text); font-weight: 550; }
.progress { margin: 14px 0 0; font-size: 13px; color: var(--text-3); }
.progress .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--fx-bar); transition: width 200ms; }

/* Header */
header .eyebrow { font-size: 13px; color: var(--text-3); margin: 0 0 8px; }
header .eyebrow code { font-size: 12px; }
h1 { font-size: 34px; line-height: 40px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; margin: 0 0 14px; text-wrap: balance; max-width: 30ch; }
.summary { max-width: 72ch; }
.summary p { margin: 0; font-size: 17px; line-height: 30px; }
.summary p + p { margin-top: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 22px 0 0; font-size: 14px; color: var(--text-3); }
.stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats .add, .stats .add b { color: var(--fx-green); }
.stats .del, .stats .del b { color: var(--fx-red); }
.cover { margin: 18px 0 0; max-width: 72ch; font-size: 14px; color: var(--text-3); }
.cover .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.cover .bar i { display: block; height: 100%; background: var(--fx-bar); }

/* Chapters */
.chapter { margin-top: 64px; padding-top: 12px; border-top: 1px solid var(--line-strong); }
/* The chapter's heading row stays at the top while its chapter scrolls by; the next chapter's takes over. */
.ch-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 12px 0; background: var(--bg); transition: box-shadow 120ms; }
.ch-head.stuck { box-shadow: 0 1px 0 var(--line); }
h2 { font-size: 24px; line-height: 30px; font-weight: 600; color: var(--text); margin: 0; text-wrap: balance; }
h2 .n { font: 500 14px/1 var(--font-mono); color: var(--text-3); margin-right: 14px; vertical-align: 3px; }
.read { font-size: 14px; color: var(--text-3); white-space: nowrap; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.read input { accent-color: var(--fx-bar); width: 16px; height: 16px; margin: 0; }
.ch-intro { max-width: 72ch; margin: -2px 0 0; }
.ch-intro p { margin: 0; }
.ch-intro p + p { margin-top: 10px; }
.step { margin-top: 32px; }
/* A step's file stays in view under its chapter's heading (54px: 12px padding, a 30px title, 12px padding) while its
   code scrolls by; the next step's takes over. */
.step-head { position: sticky; top: calc(54px + env(safe-area-inset-top, 0px)); z-index: 9; display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 4px; padding: 6px 0; background: var(--bg); font: 450 13px/1.6 var(--font-mono); transition: box-shadow 120ms; }
.step-head.stuck { box-shadow: 0 1px 0 var(--line); }
.step-head .path { color: var(--text); overflow-wrap: anywhere; }
.step-head .lines { color: var(--text-3); white-space: nowrap; }
.step-lede { margin: 0 0 12px; max-width: 72ch; font-size: 15px; }

/* Review notes, Fresh skin */
figure.codenotes { margin: 8px 0 0; }
.cn { display: grid; grid-template-columns: minmax(0, 65fr) minmax(0, 35fr); column-gap: 32px; }
.cn.cn-bare { grid-template-columns: minmax(0, 1fr); }
.cn-code { background: var(--fx-code); padding: 0 16px 0 0; min-width: 0; }
.cn-code.cn-first { border-radius: 8px 8px 0 0; padding-top: 12px; }
.cn-code.cn-last { border-radius: 0 0 8px 8px; padding-bottom: 12px; }
.cn-code.cn-first.cn-last { border-radius: 8px; }
.cn-ln { position: relative; display: grid; grid-template-columns: 3.6em 1.4em minmax(0, 1fr); font: 370 12.5px/2 var(--font-mono); color: var(--text-2); font-variant-ligatures: none; white-space: pre-wrap; overflow-wrap: anywhere; }
.cn-ln i { font-style: normal; color: var(--text-3); text-align: right; padding-right: 0.8em; user-select: none; font-variant-numeric: tabular-nums; }
.cn-ln b { font-weight: 450; color: var(--text-3); user-select: none; }
.cn-ln.cn-add { background: var(--add-w); }
.cn-ln.cn-add b::before { content: "+"; color: var(--fx-green); }
.cn-ln[hidden] { display: none; }
.cn-ln.cn-del { background: var(--del-w); color: var(--del-text); }
.cn-ln.cn-del b::before { content: "\2212"; color: var(--fx-red); }
.cn-ln.cn-del > span { opacity: 0.8; }
.cn-ln.cn-mark { box-shadow: inset 3px 0 0 color-mix(in oklab, var(--fx-bar) 30%, transparent); cursor: pointer; }
.cn-ln.cn-lit { box-shadow: inset 3px 0 0 var(--fx-bar); }
.cn-ln.cn-ctx.cn-lit { background: var(--fx-wash); }
.cn-fold { display: block; width: 100%; text-align: left; font: 450 12px/2 var(--font-mono); color: var(--fx-red); background: var(--del-w); border: 0; padding: 0 0 0 5em; cursor: pointer; }
.cn-fold:hover { text-decoration: underline; }
/* Rows that show more of a step's file, above and below it, as a quiet band across the code. */
.cn-expand { display: grid; grid-template-columns: 3.6em 1.4em minmax(0, 1fr); width: calc(100% + 16px); border: 0; padding: 0; cursor: pointer; text-align: left;
  background: color-mix(in oklab, var(--text) 5%, var(--fx-code)); color: var(--text-3); font: 450 12px/2 var(--font-mono); }
.cn-expand i { font-style: normal; text-align: right; padding-right: 0.8em; }
.cn-expand span { grid-column: 2 / -1; }
/* The lines between a step's ranges: a band like the expand rows, with arrows to open it from either side. */
.cn-gap { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); width: calc(100% + 16px); align-items: center;
  background: color-mix(in oklab, var(--text) 5%, var(--fx-code)); color: var(--text-3); font: 450 12px/2 var(--font-mono); }
.cn-gap button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.cn-gap button:hover { color: var(--text); }
.cn-gap-arrows { display: flex; justify-content: flex-end; gap: 6px; padding-right: 0.8em; }
.cn-gap-all { justify-self: start; padding-left: 1.4em !important; }
.cn-expand:hover { color: var(--text); background: color-mix(in oklab, var(--text) 8%, var(--fx-code)); }
.cn-code.cn-first > .cn-expand-up { margin-top: -12px; border-radius: 8px 8px 0 0; }
.cn-code.cn-last > .cn-expand-down { margin-bottom: -12px; border-radius: 0 0 8px 8px; }
.cn-code.cn-first > .cn-expand-up + .cn-ln, .cn-code.cn-first > .cn-expand-up + .cn-more { margin-top: 6px; }
/* Open the step's file in the reader's editor: a small icon right after its line range. */
.cn-open-file { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-left: -4px; align-self: center; border-radius: 4px; color: var(--text-3); }
.cn-open-file svg { width: 14px; height: 14px; }
.cn-open-file:hover { color: var(--fx-green); background: var(--surface-2); }
.step-head .cn-whole { margin-left: 16px; }
.step-head .cn-whole:not([hidden]):first-of-type, .step-head .cn-whole[hidden] + .cn-whole { margin-left: auto; }
.cn-whole { margin-left: auto; border: 0; background: none; padding: 0; cursor: pointer; font: 450 12px/1.6 var(--font-mono); color: var(--text-3); white-space: nowrap; }
.cn-whole:hover { color: var(--text); }
.cn-note { padding: 0 0 20px; font-size: 15px; line-height: 1.7; min-width: 0; }
.cn-note.cn-has { border-top: 1px solid var(--line); margin-top: -10px; padding: 3px 14px 20px; border-radius: 0 0 6px 0; cursor: pointer; transition: background-color 120ms, box-shadow 120ms; }
.cn-code.cn-first + .cn-note.cn-has { padding-top: 13px; margin-top: 0; }
/* A lit note: Fresh's selected row, a faint wash with a bar. */
.cn-note.cn-lit { background: var(--fx-wash); box-shadow: inset 3px 0 0 var(--fx-bar); }
.cn-note.cn-pin, .cn-ln.cn-pin { cursor: default; }
.cn-note p { margin: 0; }
.cn-note p + p { margin-top: 8px; }
.cn-note b { color: var(--text); font-weight: 600; }

/* Everything else */
.rest .ch-intro { margin-bottom: 8px; }
/* A change in a stack: its own heading, description and stats above its chapters. */
.change { margin-top: 96px; padding-top: 20px; border-top: 3px solid var(--text); }
.change .eyebrow { font-size: 13px; color: var(--text-3); margin: 0 0 8px; }
.change .eyebrow code { font-size: 12px; }
.change h2.title { font-size: 28px; line-height: 34px; font-weight: 700; margin: 0 0 14px; max-width: 40ch; }
.overview { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--line); max-width: 72ch; }
.overview a { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); color: var(--text-2); font-size: 15px; }
.overview a:hover { color: var(--text); text-decoration: none; }
.overview .n { font: 500 12px/1.9 var(--font-mono); color: var(--text-3); }
.overview .c { font: 450 12px/1.9 var(--font-mono); white-space: nowrap; }
.overview .add { color: var(--fx-green); } .overview .del { color: var(--fx-red); }
/* A file: its path stays at the top while its diff scrolls by, like a pull request's files. */
.chapter.file { margin-top: 28px; padding-top: 0; border-top: 0; }
.chapter.file .step-head { top: env(safe-area-inset-top, 0px); }
.step-head .fstat { font: 450 12px/1.6 var(--font-mono); white-space: nowrap; }
.step-head .add, .toc .add { color: var(--fx-green); } .step-head .del, .toc .del { color: var(--fx-red); }
.step-head .read { margin-left: auto; font-size: 13px; color: var(--text-3); white-space: nowrap; }
.file-note { font-size: 14px; color: var(--text-3); }
.change .summary p { font-size: 16px; line-height: 28px; }
.toc li.part { margin-top: 14px; padding: 6px 0; font: 500 11px/1.4 var(--font-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--line); }
.toc li.part a { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); padding: 0; border: 0; color: inherit; }
.toc li.part .t { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text-2); }
.rest-group { margin-top: 28px; }
h3 { font-size: 17px; line-height: 24px; font-weight: 600; color: var(--text); margin: 0 0 8px; }
h3 .count { font-weight: 450; font-size: 14px; color: var(--text-3); margin-left: 10px; }
h3.warn { color: var(--fx-red); }
.rest-file { border-bottom: 1px solid var(--line); }
.rest-group .rest-file:first-of-type { border-top: 1px solid var(--line); }
.rest-file summary { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; cursor: pointer; font: 450 13px/1.6 var(--font-mono); color: var(--text-2); list-style-position: inside; }
/* An open file's name stays in view under the chapter's heading while its changes scroll by. */
.rest-file[open] > summary { position: sticky; top: calc(54px + env(safe-area-inset-top, 0px)); z-index: 9; background: var(--bg); transition: box-shadow 120ms; }
.rest-file[open] > summary.stuck { box-shadow: 0 1px 0 var(--line); }
.rest-file summary .path { overflow-wrap: anywhere; }
.rest-file summary .count { color: var(--text-3); white-space: nowrap; }
.rest-file[open] summary { color: var(--text); }
.rest-note { margin: 0 0 10px; font-size: 14px; color: var(--text-3); max-width: 72ch; }
ul.bare { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.bare li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font: 450 13px/1.6 var(--font-mono); }
ul.bare .path { color: var(--text); overflow-wrap: anywhere; }
ul.bare .count { color: var(--text-3); white-space: nowrap; }
.rest-file figure { margin: 4px 0 14px; }

@media (max-width: 1100px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .toc { position: static; max-height: none; }
  .toc-toggle { display: none; }
  .page[data-collapsed="true"] { grid-template-columns: minmax(0, 1fr); }
  .cn { grid-template-columns: minmax(0, 1fr); }
  .cn-code { border-radius: 0; }
  .cn-note.cn-has { border-top: 0; margin-top: 0; padding: 10px 14px 18px; }
}
@media (prefers-reduced-motion: reduce) { .progress .bar i, .cn-note.cn-has, .page[data-collapsed="true"] .toc, .ch-head { transition: none; } }
</style>

<div class="page" id="page">
  <button type="button" class="toc-open" id="toc-open" aria-controls="toc" aria-label="Show the contents; click to keep them open"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg><span id="rail-count"></span></button>
  <nav class="toc" id="toc" aria-label="Changes and files">
    <div class="toc-head"><p class="eyebrow">Changes</p><button type="button" class="toc-toggle" id="toc-toggle" aria-label="Collapse the contents" title="Collapse"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4 5.5 8l4 4"/><path d="M13 3v10"/></svg></button></div>
    <ol>{{TOC}}</ol>
    <div class="progress"><span id="read-count">0</span> of <span id="read-total">0</span> files viewed<div class="bar"><i id="read-bar"></i></div></div>
  </nav>

  <main>
    <header>
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1>{{HEADING}}</h1>
      <p class="stats"><span><b>{{FILES}}</b> files</span><span class="add"><b>+{{ADDS}}</b></span><span class="del"><b>&minus;{{DELS}}</b></span></p>
      <ol class="overview">{{OVERVIEW}}</ol>
    </header>

    {{CHAPTERS}}

  </main>
</div>

<style>
/* Code colours from Shiki (GitHub's light and dark themes), one class per colouring. */
{{HL_CSS}}
</style>
<script type="application/json" id="gr-files">{{FILES_JSON}}</script>
<script>
{{SCRIPT}}
</script>
<script>
(() => {
  window.ReviewNotes.mountAll(document.querySelector("main"));
  document.querySelectorAll(".rest-file").forEach((d) => d.addEventListener("toggle", () => d.open && window.ReviewNotes.mountAll(d)));

  const KEY = {{STORE_KEY}};
  let read = {};
  try { read = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  const boxes = [...document.querySelectorAll("input[data-read]")];
  const paint = () => {
    let n = 0;
    boxes.forEach((b) => {
      b.checked = Boolean(read[b.dataset.read]);
      if (b.checked) n++;
      document.querySelector(`.toc a[href="#${b.dataset.read}"]`)?.parentElement.classList.toggle("done", b.checked);
    });
    document.getElementById("read-count").textContent = n;
    document.getElementById("read-total").textContent = boxes.length;
    document.getElementById("read-bar").style.width = boxes.length ? `${(100 * n) / boxes.length}%` : "0";
    document.getElementById("rail-count").textContent = `${n}/${boxes.length}`;
  };
  boxes.forEach((b) => b.addEventListener("change", () => {
    read[b.dataset.read] = b.checked;
    try { localStorage.setItem(KEY, JSON.stringify(read)); } catch (e) {}
    paint();
  }));
  paint();

  // The contents collapse to a button; hovering it shows them floating over the page, a click docks them again.
  const page = document.getElementById("page"), toc = document.getElementById("toc");
  const toggle = document.getElementById("toc-toggle"), open = document.getElementById("toc-open");
  const TOC_KEY = "guided-review:toc-collapsed";
  let hideTimer = null;
  const peek = (on) => { clearTimeout(hideTimer); toc.classList.toggle("peek", on); };
  const later = () => { clearTimeout(hideTimer); hideTimer = setTimeout(() => toc.classList.remove("peek"), 180); };
  const setCollapsed = (on) => {
    page.dataset.collapsed = String(on);
    toggle.setAttribute("aria-label", on ? "Keep the contents open" : "Collapse the contents");
    toggle.title = on ? "Keep open" : "Collapse";
    peek(false);
    try { localStorage.setItem(TOC_KEY, on ? "1" : "0"); } catch (e) {}
  };
  let startCollapsed = false;
  try { startCollapsed = localStorage.getItem(TOC_KEY) === "1"; } catch (e) {}
  setCollapsed(startCollapsed);
  toggle.addEventListener("click", () => setCollapsed(page.dataset.collapsed !== "true"));
  open.addEventListener("click", () => setCollapsed(false));
  open.addEventListener("mouseenter", () => peek(true));
  open.addEventListener("focus", () => peek(true));
  open.addEventListener("mouseleave", later);
  toc.addEventListener("mouseenter", () => { if (page.dataset.collapsed === "true") peek(true); });
  toc.addEventListener("mouseleave", () => { if (page.dataset.collapsed === "true") later(); });
  toc.addEventListener("focusout", (e) => { if (page.dataset.collapsed === "true" && !toc.contains(e.relatedTarget) && e.relatedTarget !== open) later(); });
  toc.addEventListener("click", (e) => { if (page.dataset.collapsed === "true" && e.target.closest("a")) peek(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && toc.classList.contains("peek")) { peek(false); open.focus(); } });

  // A chapter's heading is stuck while its chapter has scrolled past the top and still runs below it, and a step's
  // file the same under the heading. Checked on every scroll, so a jump from the contents counts too.
  const heads = [...document.querySelectorAll(".ch-head, .step-head, .rest-file > summary")];
  let queued = false;
  const markStuck = () => {
    queued = false;
    heads.forEach((h) => {
      const top = parseFloat(getComputedStyle(h).top) || 0;
      const box = h.parentElement.getBoundingClientRect();
      h.classList.toggle("stuck", box.top < top && box.bottom > top + h.offsetHeight);
    });
  };
  addEventListener("scroll", () => { if (!queued) { queued = true; requestAnimationFrame(markStuck); } }, { passive: true });
  markStuck();

  const links = new Map([...document.querySelectorAll(".toc a")].map((a) => [a.getAttribute("href").slice(1), a.parentElement]));
  const seen = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { links.forEach((li) => li.classList.remove("here")); links.get(e.target.id)?.classList.add("here"); } });
  }, { rootMargin: "0px 0px -70% 0px" });
  document.querySelectorAll("section.chapter").forEach((s) => seen.observe(s));
})();
</script>
