<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300..700&display=swap">
<style>
{{FONT_CSS}}
</style>
<style>
:root { --bg: #fff; --text: #171717; --text-2: #3b3b3b; --text-3: #737373; --line: #e8e8e8; --surface-2: #f5f7fa;
  --green: #157e3c; --red: oklch(0.58 0.2 27); --plum: oklch(0.55 0.14 320); --bar: oklch(0.627 0.194 149.214);
  --font: "Fixel", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #191b1f; --text: #fcfcfd; --text-2: #ccd2db; --text-3: #8b93a1; --line: #2c313a;
  --surface-2: #252c37; --green: oklch(0.871 0.15 154.449); --red: oklch(0.7 0.17 27); --plum: oklch(0.72 0.13 320); color-scheme: dark; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text-2); font: 450 14px/1.5 var(--font); }
#root, .page { height: 100%; }
.page { height: 100%; }
.side-panel, .main-panel { display: flex; min-width: 0; min-height: 0; }
.side { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; padding: 16px 12px 0; }
.main { flex: 1; }
.resizer { width: 1px; background: var(--line); position: relative; outline: none; }
.resizer::after { content: ""; position: absolute; inset: 0 -3px; }
.resizer:hover, .resizer[data-separator="active"], .resizer:focus-visible { background: var(--bar); }
.eyebrow { margin: 0 0 8px; font-size: 12px; color: var(--text-3); }
.changes { list-style: none; margin: 0 0 12px; padding: 0; border-bottom: 1px solid var(--line); }
.changes button { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; width: 100%; padding: 7px 8px; border: 0;
  background: none; text-align: left; font: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; }
.changes button:hover { background: var(--surface-2); }
.changes button[aria-current="true"] { background: var(--surface-2); color: var(--text); font-weight: 550; box-shadow: inset 2px 0 0 var(--bar); }
.subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cid { font: 450 12px/1.6 var(--mono); color: var(--text-3); }
.cid b { font-weight: 600; color: var(--plum); }
.tree { flex: 1; min-height: 0; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 20px 28px 16px; border-bottom: 1px solid var(--line); }
.head h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.3; color: var(--text); text-wrap: balance; }
.head .body { margin: 0 0 10px; max-width: 80ch; font-size: 14.5px; line-height: 1.75; }
.layout { display: inline-flex; margin-top: 4px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); }
.layout button { border: 0; background: none; padding: 3px 10px; font: inherit; font-size: 12px; color: var(--text-3); cursor: pointer; border-radius: 6px; }
.layout button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
.head code { font: 450 12px var(--mono); }
.add { color: var(--green); } .del { color: var(--red); }
.diffs { flex: 1; min-height: 0; overflow: auto; padding: 0 28px; --diffs-font-family: "JetBrains Mono"; --diffs-header-font-family: "JetBrains Mono"; --diffs-font-size: 12.5px; --diffs-line-height: 24px; font-weight: 350; }
.tree { --trees-font-family-override: "JetBrains Mono", ui-monospace, monospace; --trees-font-weight-regular-override: 350; }
.open { font-size: 12px; color: var(--text-3); text-decoration: none; padding: 2px 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); }
.open:hover { color: var(--text); background: var(--surface-2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="review-data">{{DATA}}</script>
<script>{{BUNDLE}}</script>
</body>
</html>
